name: Build App Android (LS)

# Compila o app Android na nuvem (servidores do GitHub) - nao precisa de PC potente.
# Roda sozinho quando algo em mobile-app/ muda, ou manualmente em Actions -> Run workflow.

on:
  workflow_dispatch:
  push:
    branches: [ls-custom]
    paths:
      - 'mobile-app/**'
      - '.github/workflows/build-android.yml'

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar dependencias
        run: npm install

      - name: Gerar projeto Android
        run: npx cap add android

      - name: Copiar sons de alerta (res/raw)
        run: |
          mkdir -p android/app/src/main/res/raw
          cp sounds/*.wav android/app/src/main/res/raw/

      - name: Copiar google-services.json (push), se existir
        run: |
          if [ -f google-services.json ]; then
            cp google-services.json android/app/google-services.json
            echo "google-services.json aplicado (push ativo)"
          else
            echo "sem google-services.json ainda (push sera ativado na Fase 2)"
          fi

      - name: Compilar APK (debug, para teste)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publicar APK como artefato
        uses: actions/upload-artifact@v4
        with:
          name: LS-Autotruck-Android
          path: mobile-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
