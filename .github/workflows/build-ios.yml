name: Build App iOS (LS)

# Gera o app do iPhone na nuvem (Mac do GitHub), assina e ENVIA para o App Store Connect (TestFlight).
# Roda sozinho quando este arquivo ou mobile-app/ios muda (ramo ls-custom), ou manualmente em Actions.
# Segredos necessarios (Settings -> Secrets and variables -> Actions):
#   APPLE_TEAM_ID  - Team ID da Apple (D47WB5VZUX)
#   ASC_KEY_ID     - ID da chave da API do App Store Connect
#   ASC_ISSUER_ID  - Issuer ID da chave
#   ASC_KEY_P8     - conteudo inteiro do arquivo AuthKey_XXXX.p8

on:
  workflow_dispatch:
    inputs:
      enviar:
        description: 'Enviar para o App Store Connect (TestFlight)?'
        type: boolean
        default: true
  push:
    branches: [ls-custom]
    paths:
      - '.github/workflows/build-ios.yml'
      - 'mobile-app/ios/**'

jobs:
  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install

      - name: Sincronizar projeto iOS (Capacitor 7, Swift Package Manager)
        run: npx cap sync ios

      - name: Conferir segredos
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
          P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          for v in TEAM KID ISS P8; do
            if [ -z "${!v}" ]; then echo "FALTA o segredo $v (veja o topo deste arquivo)"; exit 1; fi
          done
          echo "Segredos OK"

      - name: Chave da API da Apple
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p ~/private_keys
          printf '%s\n' "$ASC_KEY_P8" > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          echo "KEY_PATH=$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8" >> $GITHUB_ENV

      - name: Versao do Xcode
        run: xcodebuild -version

      - name: Compilar e assinar (archive)
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild archive \
            -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$KID" -authenticationKeyIssuerID "$ISS" \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} 2>&1 | tail -n 60

      - name: Gerar .ipa e enviar para a Apple
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KID: ${{ secrets.ASC_KEY_ID }}
          ISS: ${{ secrets.ASC_ISSUER_ID }}
          ENVIAR: ${{ inputs.enviar }}
        run: |
          DEST=export
          if [ "$ENVIAR" != "false" ]; then DEST=upload; fi
          cat > $RUNNER_TEMP/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>$DEST</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" -authenticationKeyID "$KID" -authenticationKeyIssuerID "$ISS"
          echo "Pronto. Se enviou, o app aparece no App Store Connect -> TestFlight em ~15 minutos."

      - name: Guardar o .ipa (quando nao envia)
        if: ${{ inputs.enviar == false }}
        uses: actions/upload-artifact@v4
        with:
          name: LS-Autotruck-iPhone
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: warn
